services:
  - type: web
    name: zq-ethan-homepage
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: DEEPSEEK_API_KEY
        value: DEEPSEEK_API_KEY_PLACEHOLDER
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: PORT
        value: "8000"
